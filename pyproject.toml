[project]
name = "sbn-name-resolution-service"
version = "0.2.0"
description = "PostGreSQL-backed API to fuzzy-search asteroid/comet names"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "connexion[flask,swagger-ui,uvicorn]>=3.3.0",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "gunicorn>=23.0.0",
    "psycopg2>=2.9.11",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "setproctitle>=1.3.7",
    "sqlalchemy>=2.0.44",
]

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "mypy>=1.18.2",
    "pytest>=8.4.2",
]
